name: Renderizar vídeo Manim

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-convergencia-funcoes
  cancel-in-progress: false

jobs:
  render:
    name: Renderizar convergência de sequências de funções
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python e dependências do LaTeX
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm

      - name: Instalar Manim
        run: |
          python -m pip install --upgrade pip
          python -m pip install manim

      - name: Renderizar vídeo em qualidade alta
        run: |
          manim -qh --disable_caching videos/analise_real/convergencia_sequencias_funcoes.py ConvergenciaFuncoes

      - name: Publicar MP4 para download
        uses: actions/upload-artifact@v4
        with:
          name: video-convergencia-sequencias-funcoes
          path: media/videos/convergencia_sequencias_funcoes/1080p60/ConvergenciaFuncoes.mp4
          if-no-files-found: error
          retention-days: 7
